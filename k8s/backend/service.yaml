# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gaming-store
  labels:
    app.kubernetes.io/name: gaming-store
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gaming-store
    app.kubernetes.io/component: backend
