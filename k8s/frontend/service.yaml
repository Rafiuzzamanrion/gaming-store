# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gaming-store
  labels:
    app.kubernetes.io/name: gaming-store
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: gaming-store
    app.kubernetes.io/component: frontend
