# Kustomize development overlay
# Use: kubectl apply -k k8s/overlays/development
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gaming-store

resources:
  - ../../base
  - ../../redis/deployment.yaml
  - ../../mongodb/statefulset.yaml

commonLabels:
  environment: development

# Development-specific patches
patches:
  # Reduce replicas for development
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  # Reduce resource limits for development
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
    target:
      kind: Deployment
      name: backend

# Development ConfigMap values
configMapGenerator:
  - name: gaming-store-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
      - NEXT_PUBLIC_SOCKET_URL=http://localhost
      - NEXTAUTH_URL=http://localhost
      - FRONTEND_URL=http://localhost
