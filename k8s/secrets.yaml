# Secrets template for sensitive configuration
# IMPORTANT: Replace placeholder values with base64-encoded secrets
# Example: echo -n 'your-secret' | base64
#
# WARNING: All values below are PLACEHOLDERS. You MUST replace them before deploying!
apiVersion: v1
kind: Secret
metadata:
  name: gaming-store-secrets
  namespace: gaming-store
  labels:
    app.kubernetes.io/name: gaming-store
type: Opaque
data:
  # Auth.js Secret (base64 encoded)
  # Generate: echo -n 'your-actual-secret-here' | base64
  NEXTAUTH_SECRET: "UkVQTEFDRS1XSVRILUFDVFVBTC1TRUNSRVQtSEVSRQ=="

  # JWT Secrets (base64 encoded)
  # Generate: echo -n 'your-actual-jwt-access-secret' | base64
  JWT_ACCESS_SECRET: "UkVQTEFDRS1XSVRILUFDVFVBTC1TRUNSRVQtSEVSRQ=="
  # Generate: echo -n 'your-actual-jwt-refresh-secret' | base64
  JWT_REFRESH_SECRET: "UkVQTEFDRS1XSVRILUFDVFVBTC1TRUNSRVQtSEVSRQ=="

  # Database Connection (base64 encoded)
  # For production, use managed MongoDB (Atlas, DocumentDB, etc.)
  # Generate: echo -n 'mongodb://your-connection-string' | base64
  MONGODB_URI: "UkVQTEFDRS1XSVRILUFDVFVBTC1NT05HT0RCLVVSSQ=="

  # Redis Connection (base64 encoded)
  # For production, use managed Redis (ElastiCache, MemoryStore, etc.)
  # Generate: echo -n 'redis://your-redis-host:6379' | base64
  REDIS_URL: "UkVQTEFDRS1XSVRILUFDVFVBTC1SRURJUy1VUkw="

  # Stripe Keys (base64 encoded) - Optional
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

  # OAuth Providers (base64 encoded) - Optional
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
