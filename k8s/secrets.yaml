# Secrets template for sensitive configuration
# IMPORTANT: Replace placeholder values with base64-encoded secrets
# Example: echo -n 'your-secret' | base64
apiVersion: v1
kind: Secret
metadata:
  name: gaming-store-secrets
  namespace: gaming-store
  labels:
    app.kubernetes.io/name: gaming-store
type: Opaque
data:
  # Auth.js Secret (base64 encoded)
  # echo -n 'your-nextauth-secret' | base64
  NEXTAUTH_SECRET: "eW91ci1uZXh0YXV0aC1zZWNyZXQ="

  # JWT Secrets (base64 encoded)
  JWT_ACCESS_SECRET: "eW91ci1qd3QtYWNjZXNzLXNlY3JldA=="
  JWT_REFRESH_SECRET: "eW91ci1qd3QtcmVmcmVzaC1zZWNyZXQ="

  # Database Connection (base64 encoded)
  # For production, use managed MongoDB (Atlas, DocumentDB, etc.)
  MONGODB_URI: "bW9uZ29kYjovL21vbmdvOjI3MDE3L2dhbWluZy1zdG9yZQ=="

  # Redis Connection (base64 encoded)
  # For production, use managed Redis (ElastiCache, MemoryStore, etc.)
  REDIS_URL: "cmVkaXM6Ly9yZWRpczo2Mzc5"

  # Stripe Keys (base64 encoded) - Optional
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

  # OAuth Providers (base64 encoded) - Optional
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
